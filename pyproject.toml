[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "portguard-ais"
version = "1.0.0"
description = "Explainable collision-risk alerts and vessel-encounter analytics for restricted port waters."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Irmina Durlik" },
  { name = "Tymoteusz Miller" },
]
keywords = ["AIS", "maritime safety", "collision risk", "COLREG", "near miss"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "pydantic>=2.10",
  "rich>=13.9",
  "typer>=0.15",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.9"]
dev = [
  "build>=1.2",
  "hypothesis>=6.120",
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "mypy>=2.3",
  "pandas-stubs>=2.2",
  "pip-audit>=2.8",
  "pre-commit>=4.1",
  "pytest>=9.0",
  "pytest-cov>=6.0",
  "ruff>=0.16",
]

[project.scripts]
portguard-ais = "portguard_ais.cli:app"

[project.urls]
Documentation = "https://github.com/OWNER/PortGuard-AIS#readme"
Issues = "https://github.com/OWNER/PortGuard-AIS/issues"
Source = "https://github.com/OWNER/PortGuard-AIS"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portguard_ais = ["py.typed"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "DTZ",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-config --strict-markers --cov=portguard_ais --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
markers = [
  "integration: end-to-end or filesystem integration tests",
]

[tool.coverage.run]
branch = true
source = ["portguard_ais"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.13"
packages = ["portguard_ais"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
